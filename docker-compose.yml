services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: leaveflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${LEAVEFLOW_SQL_PASSWORD:?Set LEAVEFLOW_SQL_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - leaveflow-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  leaveflow-sql-data:
